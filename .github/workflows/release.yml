name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / version (e.g. v0.2.0, or prerelease)"
        required: false
        default: "prerelease"
        type: string
      version_code:
        description: "Optional positive integer versionCode override"
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.tag || 'prerelease') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          raw_tag="${INPUT_TAG:-}"
          raw_tag="${raw_tag#"${raw_tag%%[![:space:]]*}"}"
          raw_tag="${raw_tag%"${raw_tag##*[![:space:]]}"}"

          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            is_rolling="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ -z "$raw_tag" ] || [ "$raw_tag" = "prerelease" ]; }; then
            is_rolling="true"
          else
            is_rolling="false"
          fi

          short_sha="$(git rev-parse --short HEAD)"
          base_tag=""

          if [ "$is_rolling" = "true" ]; then
            tag="prerelease"
            prerelease="true"
            base_tag="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -n "$base_tag" ]; then
              base_ver="${base_tag#v}"
              commits_since="$(git rev-list --count "${base_tag}..HEAD")"
              version_name="${base_ver}-dev.${commits_since}+${short_sha}"
            else
              commits_since="$(git rev-list --count HEAD)"
              version_name="0.0.0-dev.${commits_since}+${short_sha}"
            fi
            asset_stem="openchamber-ptt-prerelease"
            artifact_name="openchamber-ptt-prerelease-${short_sha}"
          else
            if [ -z "$raw_tag" ]; then
              raw_tag="$GITHUB_REF_NAME"
            fi
            case "$raw_tag" in
              v*) tag="$raw_tag"; version_name="${raw_tag#v}" ;;
              *)  tag="v$raw_tag"; version_name="$raw_tag" ;;
            esac
            if [ "$INPUT_PRERELEASE" = "true" ] || printf '%s' "$version_name" | grep -q '-'; then
              prerelease="true"
            else
              prerelease="false"
            fi
            commits_since="0"
            asset_stem="openchamber-ptt-${version_name}"
            safe_ver="$(printf '%s' "$version_name" | tr '+' '-')"
            artifact_name="openchamber-ptt-release-${safe_ver}"
          fi

          if [ -n "$INPUT_VERSION_CODE" ]; then
            version_code="$INPUT_VERSION_CODE"
          else
            core="${version_name%%-*}"
            if printf '%s' "$core" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              major="$(printf '%s' "$core" | cut -d. -f1)"
              minor="$(printf '%s' "$core" | cut -d. -f2)"
              patch="$(printf '%s' "$core" | cut -d. -f3)"
              offset=$(( 10#$commits_since > 999 ? 999 : 10#$commits_since ))
              version_code=$((10#$major * 10000000 + 10#$minor * 100000 + 10#$patch * 1000 + offset))
              if [ "$version_code" -le 0 ]; then
                version_code="$GITHUB_RUN_NUMBER"
              fi
            else
              version_code="$GITHUB_RUN_NUMBER"
            fi
          fi

          {
            echo "tag=$tag"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "prerelease=$prerelease"
            echo "is_rolling=$is_rolling"
            echo "base_tag=$base_tag"
            echo "short_sha=$short_sha"
            echo "asset_stem=$asset_stem"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing required signing secrets:$missing" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "${{ runner.temp }}/release.jks"
          chmod 600 "${{ runner.temp }}/release.jks"

      - name: Test, lint, and build signed release APK
        env:
          OPENCHAMBER_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          OPENCHAMBER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OPENCHAMBER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OPENCHAMBER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OPENCHAMBER_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          OPENCHAMBER_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Verify APK signature and prepare release assets
        env:
          ASSET_STEM: ${{ steps.meta.outputs.asset_stem }}
        run: |
          apk_in="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk_in" ]; then
            echo "Expected signed release APK at $apk_in" >&2
            exit 1
          fi
          apksigner_bin="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$apksigner_bin" ]; then
            echo "apksigner not found in Android SDK build-tools" >&2
            exit 1
          fi
          "$apksigner_bin" verify --verbose "$apk_in"

          mkdir -p dist
          apk_out="dist/${ASSET_STEM}.apk"
          cp "$apk_in" "$apk_out"
          (cd dist && sha256sum "${ASSET_STEM}.apk" > "${ASSET_STEM}.apk.sha256")

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          BASE_TAG: ${{ steps.meta.outputs.base_tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          IS_ROLLING: ${{ steps.meta.outputs.is_rolling }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$IS_ROLLING" = "true" ]; then
            git tag -f "$TAG" "$TARGET_SHA"
            git push --force origin "refs/tags/$TAG"

            notes_file="${{ runner.temp }}/release-notes.md"
            {
              printf 'Rolling prerelease built from `main` (`%s`).\n\n' "$SHORT_SHA"
              printf '- **versionName:** `%s`\n' "$VERSION_NAME"
              printf '- **versionCode:** `%s`\n' "$VERSION_CODE"
              printf '- **commit:** `%s`\n' "$TARGET_SHA"
              if [ -n "$BASE_TAG" ]; then
                printf '- **base tag:** `%s`\n' "$BASE_TAG"
                changes="$(git log --no-merges --max-count=30 --pretty='- %h %s' "${BASE_TAG}..${TARGET_SHA}")"
                if [ -n "$changes" ]; then
                  printf '\n### Changes since `%s`\n%s\n' "$BASE_TAG" "$changes"
                fi
                printf '\n**Full Changelog:** https://github.com/%s/compare/%s...%s\n' "$REPO" "$BASE_TAG" "$TARGET_SHA"
              else
                changes="$(git log --no-merges --max-count=20 --pretty='- %h %s' "$TARGET_SHA")"
                if [ -n "$changes" ]; then
                  printf '\n### Recent changes\n%s\n' "$changes"
                fi
              fi
            } > "$notes_file"

            title="Prerelease (${VERSION_NAME})"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
              gh release edit "$TAG" \
                --draft=false \
                --prerelease \
                --latest=false \
                --title "$title" \
                --notes-file "$notes_file"
            else
              gh release create "$TAG" dist/*.apk dist/*.sha256 \
                --prerelease \
                --latest=false \
                --title "$title" \
                --notes-file "$notes_file"
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
            else
              flags=""
              if [ "$PRERELEASE" = "true" ]; then
                flags="$flags --prerelease --latest=false"
              fi
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                flags="$flags --target $TARGET_SHA"
              fi
              gh release create "$TAG" dist/*.apk dist/*.sha256 --title "$TAG" --generate-notes $flags
            fi
          fi
